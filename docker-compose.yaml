services:
  go-todolist-database:
    image: postgres:18.6-bookworm
    container_name: go-todolist-database
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql

  go-todolist-db-migrate:
    image: migrate/migrate:v4.20.1
    volumes:
      - "${PROJECT_ROOT}/migrations:/migrations"

  go-todolist-port-forwarder:
    image: alpine/socat:1.8.1.3
    container_name: go-todolist-database-port-forwarder
    command:
      - tcp-listen:5432,fork,reuseaddr
      - tcp-connect:go-todolist-database:5432
    ports:
      - "127.0.0.1:5432:5432"
volumes:
  postgres_data: